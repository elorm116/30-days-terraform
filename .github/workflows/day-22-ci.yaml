name: Infrastructure CI — Integrated Pipeline - Day 22

on:
  pull_request:
    branches: [main]
    paths:
      - "Day-22/**"
      - ".github/workflows/day-22-ci.yaml"
  push:
    branches: [main]
    paths:
      - "Day-22/**"
      - ".github/workflows/day-22-ci.yaml"

env:
  TF_VERSION: "1.14.6"
  TF_DIR: "./Day-22"
  AWS_REGION: "us-east-1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}
      - name: Init & Validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ${{ env.TF_DIR }}

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init and Run terraform test
        run: |
          terraform init -backend=false
          terraform test -no-color
        working-directory: ${{ env.TF_DIR }}

  security-scan:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608
        with:
          working_directory: ${{ env.TF_DIR }}
          sarif_file: tfsec.sarif
      - uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225
        with:
          sarif_file: tfsec.sarif

  # ── PLAN JOBS ──────────────────────────────────────────────────────────────

  plan-dev:
    name: Plan Dev
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, security-scan]
    environment: dev
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Plan Dev
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file=dev.tfvars -out=dev.tfplan -no-color
      - name: Upload Dev Plan
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: dev-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}/dev.tfplan

  plan-prod:
    name: Plan Prod
    runs-on: ubuntu-latest
    needs: [validate, unit-tests, security-scan]
    environment: prod
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Plan Prod
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select prod || terraform workspace new prod
          terraform plan -var-file=prod.tfvars -out=prod.tfplan -no-color
      - name: Upload Prod Plan
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: prod-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}/prod.tfplan

  # ── APPLY JOBS (On Push to Main) ──────────────────────────────────────────

  apply-dev:
    name: Apply to Dev
    runs-on: ubuntu-latest
    needs: plan-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Download Dev Plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: dev-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}
      - name: Apply to Dev
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select dev
          terraform apply -no-color dev.tfplan

  apply-prod:
    name: Apply to Prod
    runs-on: ubuntu-latest
    needs: [apply-dev, plan-prod]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Download Prod Plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: prod-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}
      - name: Apply to Prod
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select prod
          terraform apply -no-color prod.tfplan

  # ── CLEANUP LOGIC ──────────────────────────────────────────────────────────

  cleanup:
    name: Cleanup — Destroy All Infrastructure
    runs-on: ubuntu-latest
    needs: apply-prod
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Wait 5 minutes
        run: sleep 300
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Destroy Infrastructure
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          echo "Destroying PROD..."
          terraform workspace select prod || true
          terraform destroy -auto-approve -no-color || true
          echo "Destroying DEV..."
          terraform workspace select dev || true
          terraform destroy -auto-approve -no-color || true