name: Infrastructure CI — Integrated Pipeline

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main]
    paths:
      - "Day-22/**"
      - ".github/workflows/day-22-ci.yaml"
  push:
    branches: [main]
    paths:
      - "Day-22/**"

# ── Global permissions ────────────────────────────────────────────────────────
permissions:
  contents: read
  pull-requests: write
  id-token: write        # OIDC → AWS
  security-events: write # SARIF upload for tfsec

# ── Environment ───────────────────────────────────────────────────────────────
env:
  TF_VERSION: "1.14.6"
  TF_DIR: "./Day-22"
  AWS_REGION: "us-east-1"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1: Validate & Lint
# Runs on every PR. No AWS credentials needed — uses -backend=false.
# This is the cheapest and fastest gate; fail here early.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        id: fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Init (no backend)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Validate
        id: validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate -no-color

      - name: Comment fmt failure
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **`terraform fmt` check failed.**\n\nRun `terraform fmt -recursive` locally, commit the result, and push again.'
            })

      - name: Fail if fmt failed
        if: steps.fmt.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Unit Tests
  # Runs terraform test — the native test framework.
  # Uses plan-only mode, no actual AWS provisioning.
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (terraform test)
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend=false

      - name: Run unit tests
        id: test
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform test -no-color 2>&1 | tee test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment test results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('${{ env.TF_DIR }}/test_output.txt', 'utf8');
            const passed = output.includes('passed') && !output.includes('failed');
            const icon = passed ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${icon} Terraform Test Results\n\n\`\`\`\n${output}\n\`\`\``
            });

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Security Scan (tfsec)
  # Static analysis — no AWS credentials needed.
  # SARIF results uploaded to GitHub Security tab.
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run tfsec with SARIF output
        uses: aquasecurity/tfsec-sarif-action@21ded20e8ca120cd9d3d6ab04ef746477542a608
        with:
          working_directory: ${{ env.TF_DIR }}
          sarif_file: tfsec.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@2c779ab0d087cd7fe7b826087247c2c81f27bfa6
        with:
          sarif_file: tfsec.sarif

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Plan (dev)
  # Generates an immutable plan artifact from the dev workspace.
  # Posts the full plan output as a PR comment.
  # The saved plan file IS the artifact that gets promoted to production.
  # ─────────────────────────────────────────────────────────────────────────────
  plan:
    name: Plan (dev workspace)
    runs-on: ubuntu-latest
    needs: [validate, unit-tests]
    if: github.event_name == 'pull_request'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Select dev workspace
        working-directory: ${{ env.TF_DIR }}
        run: terraform workspace select dev || terraform workspace new dev

      - name: Plan (produce immutable artifact)
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var-file=dev.tfvars \
            -out=ci.tfplan \
            -no-color \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      # ── The immutable artifact ───────────────────────────────────────────────
      # This saved plan file (ci.tfplan) is the artifact promoted through envs.
      # apply-dev and apply-prod both download and apply this exact file —
      # they do NOT re-run terraform plan. What was reviewed is what gets applied.
      - name: Upload plan artifact (immutable)
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            ${{ env.TF_DIR }}/ci.tfplan
            ${{ env.TF_DIR }}/plan_output.txt
          retention-days: 7   # Plans older than 7 days cannot be applied

      - name: Comment plan on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const body = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n_(truncated — see full output in CI logs)_'
              : plan;
            const outcome = '${{ steps.plan.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${icon} Terraform Plan — dev\n\n<details><summary>Click to expand</summary>\n\n\`\`\`hcl\n${body}\n\`\`\`\n\n</details>\n\n**Artifact:** \`terraform-plan-${{ github.sha }}\` (expires 7 days)`
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Apply (dev)
  # Runs on merge to main. Downloads the SAME plan artifact generated in Job 4.
  # Never re-generates the plan — promotes the exact reviewed artifact.
  # ─────────────────────────────────────────────────────────────────────────────
  apply-dev:
    name: Apply (dev workspace)
    runs-on: ubuntu-latest
    needs: [plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: dev
      url: https://app.terraform.io/app/mali-org/workspaces/dev

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Download plan artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Select dev workspace
        working-directory: ${{ env.TF_DIR }}
        run: terraform workspace select dev

      - name: Apply (immutable plan)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -no-color ci.tfplan

      - name: Verify clean post-apply state
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -var-file=dev.tfvars -detailed-exitcode -no-color
          echo "Post-apply plan exit code: $? (0=clean, 2=drift)"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Apply (prod)
  # Manual approval required (GitHub Environment protection rule).
  # Downloads the SAME plan artifact from Job 4 — not re-generated.
  # Sentinel policies in Terraform Cloud enforce additional gates at this stage.
  # ─────────────────────────────────────────────────────────────────────────────
  apply-prod:
    name: Apply (prod workspace)
    runs-on: ubuntu-latest
    needs: [apply-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: prod
      url: https://app.terraform.io/app/mali-org/workspaces/prod
    # The 'prod' environment in GitHub has a required reviewer configured.
    # This job will pause until a named approver clicks "Approve" in the UI.

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Download plan artifact (same artifact as dev apply)
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Select prod workspace
        working-directory: ${{ env.TF_DIR }}
        run: terraform workspace select prod || terraform workspace new prod

      - name: Apply (same immutable plan — no re-plan)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -no-color ci.tfplan

      - name: Verify clean post-apply state (prod)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -var-file=prod.tfvars -detailed-exitcode -no-color
          echo "Post-apply plan exit code: $? (0=clean, 2=drift detected — INVESTIGATE)"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7: Cleanup (destroy)
  # Automatically destroys all infrastructure 5 minutes after apply-prod completes.
  # This prevents runaway costs while allowing verification that resources were created.
  # ─────────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup — Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: [apply-prod]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Wait 5 minutes before cleanup
        run: sleep 300

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Destroy All (prod workspace)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform workspace select prod
          terraform destroy -auto-approve -no-color

      - name: Destroy All (dev workspace)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform workspace select dev
          terraform destroy -auto-approve -no-color