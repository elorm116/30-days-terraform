name: Infrastructure CI — Integrated Pipeline - Day 22

on:
  pull_request:
    branches: [main]
    paths:
      - "Day-22/**"
      - ".github/workflows/day-22-ci.yaml"
  push:
    branches: [main]
    paths:
      - "Day-22/**"
      - ".github/workflows/day-22-ci.yaml"

env:
  TF_VERSION: "1.14.6"
  TF_DIR: "./Day-22"
  AWS_REGION: "us-east-1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}
      - name: Init & Validate
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: ${{ env.TF_DIR }}

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Plan
        id: plan
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file=dev.tfvars -out=ci.tfplan -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@834a144ee995460fba8ed112a2fc961b36a5ec5a
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}/ci.tfplan
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\n\`\`\`hcl\n${plan}\n\`\`\``
            });

  apply-dev:
    name: Apply to Dev
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Download Plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}
      - name: Apply to Dev
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select dev
          terraform apply -no-color ci.tfplan

  apply-prod:
    name: Apply to Prod
    runs-on: ubuntu-latest
    needs: apply-dev
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Download Plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: terraform-plan-${{ github.sha }}
          path: ${{ env.TF_DIR }}
      - name: Apply to Prod
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select prod || terraform workspace new prod
          terraform apply -no-color ci.tfplan

  cleanup:
    name: Cleanup — Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: apply-prod
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Wait for Verification (3 mins)
        run: sleep 180
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Destroy All
        run: |
          cd ${{ env.TF_DIR }}
          terraform init
          terraform workspace select prod && terraform destroy -auto-approve
          terraform workspace select dev && terraform destroy -auto-approve